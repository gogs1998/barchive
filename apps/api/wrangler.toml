name = "bariq-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"

# Default / local dev — uses a local D1 simulation
[[ d1_databases ]]
binding = "DB"
database_name = "bariq-dev"
database_id = "local"

[vars]
ENVIRONMENT = "development"
FRONTEND_ORIGIN = "http://localhost:3000"

# ── Staging ─────────────────────────────────────────────────────────────────
[env.staging]
name = "bariq-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "bariq-staging"
database_id = "a1965723-88c2-497c-b100-095b80df59c6"

# ── Production ──────────────────────────────────────────────────────────────
[env.production]
name = "bariq-api"
# Worker only handles /api/* and /health — all other paths served by Cloudflare Pages
# zone_id for bariq.co.uk: 8c7d3457d3b5b5f1c1be246798f9df11
[[env.production.routes]]
pattern = "bariq.co.uk/api/*"
zone_id = "8c7d3457d3b5b5f1c1be246798f9df11"

[[env.production.routes]]
pattern = "bariq.co.uk/health"
zone_id = "8c7d3457d3b5b5f1c1be246798f9df11"

[[env.production.routes]]
pattern = "www.bariq.co.uk/api/*"
zone_id = "8c7d3457d3b5b5f1c1be246798f9df11"

[[env.production.routes]]
pattern = "www.bariq.co.uk/health"
zone_id = "8c7d3457d3b5b5f1c1be246798f9df11"

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_ORIGIN = "https://bariq.co.uk,https://www.bariq.co.uk"

# Per-IP throttle on POST /api/v1/auth/* (NEW-2): 10 requests / 60 s.
[[env.production.unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[env.production.d1_databases]]
binding = "DB"
database_name = "bariq-production"
database_id = "5b0eba5c-f049-4d89-ad80-4b8b4e77f407"
